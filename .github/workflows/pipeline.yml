name: Pruebas y Build de AgendaYA

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  testing-y-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci

    - name: Revisar calidad del código (Lint)
      run: npm run lint

    - name: Ejecutar los Casos de Prueba (Jest)
      run: npm test

    - name: Verificar que el proyecto compile (Build)
      run: npm run build