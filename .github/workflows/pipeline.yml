name: AgendaYA CI Pipeline - Plan de Mantenimiento (TP7)

on:
  push:
    branches: [ "main", "develop", "hotfix/*" ]
  pull_request:
    branches: [ "main", "develop", "hotfix/*" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 3. Instalar dependencias
      run: npm ci

    - name: 4. Verificar formato y tipos del código (Format & Type Check)
      run: npx tsc --noEmit

    - name: 5. Linter (Calidad de código)
      run: npm run lint

    - name: 6. Tests Unitarios (Jest)
      run: npm test

    - name: 7. Compilación y Build (Next.js)
      run: npm run build